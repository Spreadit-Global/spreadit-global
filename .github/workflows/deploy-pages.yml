name: Deploy SPREAD GLOBAL to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Check admin dashboard behavior
        run: npm run test:admin
      - name: Build site
        run: npm run build
        env:
          VITE_CALENDLY_URL: https://calendly.com/spreadittech/30min
          VITE_GOOGLE_FORM_URL: https://forms.gle/hbQazpkqBAuVyLaP7
          VITE_ADMIN_DASHBOARD_URL: ${{ vars.ADMIN_DASHBOARD_URL }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
